<!doctype html>
<html lang="zh-CN" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body id="top">

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" class="layout" role="main">
      <aside class="layout__side">
        {% include author-profile.html %}
      </aside>

      <article class="layout__content" itemscope itemtype="http://schema.org/CreativeWork">
        {{ content }}
      </article>
    </div>

    <footer class="site-footer">
      <p>© {{ site.time | date: "%Y" }} {{ site.title }} · 最后更新于 {{ site.time | date: "%Y-%m-%d" }}</p>
    </footer>

    {% include scripts.html %}

  </body>
</html>
