<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="#top">{{ site.title }}</a>
    <nav id="page-nav" class="site-nav" aria-label="页面导航">
      <ul class="visible-links">
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url }}">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
      <button type="button" class="hidden" aria-label="更多栏目" aria-expanded="false"><span class="site-nav__icon"></span></button>
      <ul class="hidden-links hidden"></ul>
    </nav>
  </div>
</header>
